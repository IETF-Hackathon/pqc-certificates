name: Artifact validation

on:
  pull_request:
  push:
    branches: [ '*' ]

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  bc_validation:
    runs-on: ubuntu-latest
    container: bcdocker2000/bc_hackathon_pqc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test artifacts with BC
        run: ./src/test_certs_r5.sh bc
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compatibility_bc_csv
          path: ./output/
  openssl_cert_validation:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install OpenSSL 3.5
        run: dnf -y install zip diff openssl
      - name: Test artifacts with OpenSSL 3.5
        run: ./src/test_certs_r5_openssl.sh
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compatibility_openssl_csv
          path: ./output/
  openssl_cms_validation:
    runs-on: ubuntu-latest
    container: debian:sid
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install OpenSSL 3.6
        run: |
            apt-get update
            apt-get install -y zip unzip openssl
            openssl version
            openssl version | grep -q '^OpenSSL 3\.6\.' || { echo "Expected OpenSSL 3.6"; exit 1; }
      - name: Test CMS artifacts with OpenSSL 3.6
        run: ./src/test_cms_v3_openssl.sh
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compatibility_openssl36_csv
          path: ./output/
  qubip_aurora_cert_validation:
    runs-on: ubuntu-latest
    container: nisectuni/pq-container:f42-aurora-nt-1783613245
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install prereqs
        run: dnf -y install zip diff
      - name: Test artifacts with OpenSSL 3.2 with aurora provider
        run: ./src/test_certs_r5.sh qubip-aurora
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compatibility_qubip_aurora_csv
          path: ./output/
  oqs_cert_validation:
    runs-on: ubuntu-latest
    # OpenSSL 3.6.0 + oqs-provider 0.11.0 + liboqs 0.15.0 ("latest" as of 2026-10-26)
    container: openquantumsafe/oqs-ossl3:latest@sha256:fbb6e06842a2ba2bce0721ebb5ffe62c909ce8443382fd9a102c8381b2d1b3f7
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test artifacts with OpenSSL and oqsprovider
        run: |
          openssl version
          ./src/test_certs_r5.sh oqs
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compatibility_oqs_csv
          path: ./output/

  pittv3_cert_validation:
    runs-on: ubuntu-latest
    env:
      PITTV3_VERSION: 0.2.0-rc.2
      PITTV3_SHA256: 9dbd7939e50b704b5712086a7e53df5fc5adc1bc74f3e359c78bbdc3c6f0d194
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pittv3
        run: |
          name=pittv3-${PITTV3_VERSION}-x86_64-unknown-linux-gnu
          curl -sSfL -o "$name.tar.gz" \
            "https://github.com/carl-wallace/rust-pki/releases/download/pittv3-v${PITTV3_VERSION}/$name.tar.gz"
          echo "${PITTV3_SHA256}  $name.tar.gz" | sha256sum -c
          tar xzf "$name.tar.gz"
          echo "PITTV3=$PWD/$name/pittv3" >> "$GITHUB_ENV"
      - name: Test artifacts with pittv3
        run: ./src/test_certs_r5_pittv3.sh
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compatibility_pittv3_csv
          path: ./output/
  pkilint_cert_validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pkilint
        run: python -m pip install pkilint==0.13.4
      - name: Lint certificates with pkilint
        run: python3 src/test_certs_r5_pkilint.py
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compatibility_pkilint_csv
          path: ./output/
  conformance_validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # to find the zips a pull request changes
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pyasn1
        run: python -m pip install pyasn1==0.6.3 pyasn1-alt-modules==0.4.10
      - name: Check the R5 certificate and CMS v3 artifacts conform
        run: python3 src/test_artifacts_conformance.py
      - name: Report the findings for the zips this pull request changes
        if: github.event_name == 'pull_request'
        run: |
          # Added, modified or renamed zips; a deleted one has nothing to check
          mapfile -t zips < <(git diff --name-only --diff-filter=d "${{ github.event.pull_request.base.sha }}" HEAD -- \
              'providers/*/artifacts_certs_r5.zip' 'providers/*/artifacts_cms_v3.zip')
          if [ ${#zips[@]} -eq 0 ]; then
              echo "This pull request adds or changes no artifacts_certs_r5.zip or artifacts_cms_v3.zip." >> "$GITHUB_STEP_SUMMARY"
              exit 0
          fi
          python3 src/test_artifacts_conformance.py --output-dir pr-output "${zips[@]}"
          shopt -s nullglob
          pages=(pr-output/*/*.md)
          if [ ${#pages[@]} -eq 0 ]; then
              echo "The changed zips hold no artifacts and have no findings." >> "$GITHUB_STEP_SUMMARY"
              exit 0
          fi
          # Without the page's style block and {#anchor} attributes, which the step summary shows as text
          sed -e '/^<style>/d' -e 's/ {#[^}]*}$//' "${pages[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compatibility_conformance_csv
          path: ./output/
  composite_ref_impl_validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install python requirements of pqc-certificates
        run: python -m pip install -r src/requirements.txt
      - name: Clone composite sigs ref impl repo
        uses: actions/checkout@v4
        with:
          repository: lamps-wg/draft-composite-sigs
          path: ./draft-composite-sigs
      - name: Install python requirements of composite-sigs
        run: python -m pip install -r ./draft-composite-sigs/src/requirements.txt
      - name: Test artifacts with composite Sigs reference implementation
        run: |
            shopt -s globstar
            for i in **/artifacts_certs_r5.zip; do ./draft-composite-sigs/src/test_artifacts_r5.py "$(basename $(dirname "$i"))" "$i" | tee -a composite-sigs-ref-impl.log; done;
      - name: Clone composite kem ref impl repo
        uses: actions/checkout@v4
        with:
          repository: lamps-wg/draft-composite-kem
          path: ./draft-composite-kem
      - name: Install python requirements of composite-kem
        run: python -m pip install -r ./draft-composite-kem/src/requirements.txt
      - name: Test artifacts with composite KEM reference implementation
        run: |
            shopt -s globstar
            for i in **/artifacts_certs_r5.zip; do ./draft-composite-kem/src/test_artifacts_r5.py "$(basename $(dirname "$i"))" "$i" | tee -a composite-kem-ref-impl.log; done;
      
      - name: Copy logs to output
        run: |
            mkdir -p ./output/certs
            cp composite-sigs-ref-impl.log ./output/certs/
            cp composite-kem-ref-impl.log ./output/certs/
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compatibility_composite-refl-impl_csv
          path: ./output/
  # Checks the result files a pull request or push adds or changes for the problems the result pages report
  # (malformed files, unknown producers, invalid types, ...), so they are fixed before they reach the pages.
  # Errors fail the job; warnings are shown as annotations on the files.
  result_files_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install python requirements
        run: python -m pip install -r src/requirements.txt pytest
      - name: Test the scoreboard
        run: python -m pytest -q src/test_result_files.py src/test_verifier_scoreboard.py
      - name: Check the changed result files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          # a new branch has no previous commit, and a force push may leave it out of the history
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with; checking nothing."
            exit 0
          fi
          python3 src/check_result_files.py --base "$base"
  build_results_html:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    # needs: [bc_validation, openssl_cert_validation, openssl_cms_validation, ssai_validation, composite_ref_impl_validation]
    needs: [bc_validation, openssl_cert_validation, openssl_cms_validation, composite_ref_impl_validation, qubip_aurora_cert_validation, oqs_cert_validation, pittv3_cert_validation, pkilint_cert_validation, conformance_validation]
    steps:
      # The container has no git, without which actions/checkout downloads the files rather than cloning, so git is
      # installed first. The manual result pages need the full commit history (fetch-depth 0; the old versions of
      # the files are not needed, so blob:none): results older than the zip they verify are left out.
      - name: Install packages
        run: |
          apt-get update && \
          apt-get install -y pandoc lsb-release git
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install python requirements
        run: python -m pip install -r src/requirements.txt
      - name: Get BC results from previous job
        uses: actions/download-artifact@v4
        with:
          name: Compatibility_bc_csv
          path: output/
      - name: Get OpenSSL results from previous job
        uses: actions/download-artifact@v4
        with:
          name: Compatibility_openssl_csv
          path: output/
      - name: Get QUBIP-aurora results from previous job
        uses: actions/download-artifact@v4
        with:
          name: Compatibility_qubip_aurora_csv
          path: output/
      - name: Get OQS results from previous job
        uses: actions/download-artifact@v4
        with:
          name: Compatibility_oqs_csv
          path: output/
      - name: Get pittv3 results from previous job
        uses: actions/download-artifact@v4
        with:
          name: Compatibility_pittv3_csv
          path: output/
      - name: Get OpenSSL 3.6 results from previous job
        uses: actions/download-artifact@v4
        with:
          name: Compatibility_openssl36_csv
          path: output/
      - name: Get RefImpl results from previous job
        uses: actions/download-artifact@v4
        with:
          name: Compatibility_composite-refl-impl_csv
          path: output/
      - name: Get pkilint results from previous job
        uses: actions/download-artifact@v4
        with:
          name: Compatibility_pkilint_csv
          path: output/
      - name: Get conformance results from previous job
        uses: actions/download-artifact@v4
        with:
          name: Compatibility_conformance_csv
          path: output/
      - name: Build compat matrix (certs_r5)
        run: ./src/rebuild_results_certs_r5.sh
      - name: Build pkilint findings page
        run: pandoc -f markdown output/certs/pkilint_certs.md > docs/gh-pages/pkilint_certs.html
      - name: Build conformance findings pages
        run: |
          pandoc -f markdown output/certs/r5_conformance_certs.md > docs/gh-pages/r5_conformance_certs.html
          pandoc -f markdown output/cms/cms_v3_conformance.md > docs/gh-pages/cms_v3_conformance.html
      - name: Build compat matrix (cms_v3)
        run: ./src/rebuild_results_cms_v3.sh
      - name: Copy output files (automated certs_r5)
        run: cp ./docs/pqc_hackathon_results_certs_r5_automated_tests.html ./docs/pqc_hackathon_results_certs_r5_automated_tests_standardized.html ./output/certs/bc_certs.log ./output/certs/openssl_certs.log ./output/certs/composite-sigs-ref-impl.log ./output/certs/composite-kem-ref-impl.log ./output/cms/openssl_cms.log ./output/certs/qubip-aurora_certs.log ./output/certs/oqs_certs.log ./output/certs/pittv3_certs.log ./output/certs/pkilint_certs.log ./output/certs/r5_conformance_certs.log ./docs/gh-pages
      - name: Copy output files (automated cms_v3)
        run: cp ./docs/pqc_hackathon_results_cms_v3_automated_tests.html ./docs/pqc_hackathon_results_cms_v3_automated_tests_standardized.html ./output/cms/openssl_cms.log ./output/cms/cms_v3_conformance.log ./docs/gh-pages
      - name: Copy output files (manual r5/v1)
        run: cp ./docs/pqc_hackathon_results_certs_r5.html ./docs/pqc_hackathon_results_cms_v1.html ./docs/gh-pages
      - name: Copy output files (manual r5/v3)
        run: cp ./docs/pqc_hackathon_results_certs_r5.html ./docs/pqc_hackathon_results_certs_r5_standardized.html ./docs/pqc_hackathon_results_cms_v3.html ./docs/pqc_hackathon_results_cms_v3_standardized.html ./docs/gh-pages
      - name: Copy output files (manual jose_cose_v1)
        run: cp ./docs/pqc_hackathon_results_jose_cose_v1.html ./docs/gh-pages
      - name: Archive Compatibility Matrix For Download
        uses:  actions/upload-pages-artifact@v3
        with:
          path: ./docs/gh-pages
  publish_to_gh_pages:
    needs: build_results_html
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Update git pages with new compatibiliy matrix
        id: deployment
        uses: actions/deploy-pages@v4
